name: ตรวจผู้เล่นสองคนก่อนเผยแพร่

on:
  push:
    branches: ["codex/verify-store-players-20261116"]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      STORE_BASE_SHA: "e5a0f83aadb635355dac285b0b1d65e3ca03da92"
      CHECKPOINT_SHA: "91b7426c193b32a5bec0e312f5997ca0e0a874fc"
    steps:
      - name: ดึงฐานที่ต้องตรวจ
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: เตรียม Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: ตรวจคลังฐานเดิม
        run: node scripts/check-content.js
      - name: ติดตั้งชุดปรับผู้เล่นสำหรับตรวจ
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, json, base64, hashlib, urllib.request
          from pathlib import Path
          root = Path.cwd().resolve()
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          def blob(sha):
              req = urllib.request.Request('https://api.github.com/repos/' + repo + '/git/blobs/' + sha, headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req, timeout=60) as response: obj = json.load(response)
              data = base64.b64decode(obj['content'])
              assert hashlib.sha1(('blob ' + str(len(data)) + '\0').encode() + data).hexdigest() == sha, 'blob digest ' + sha
              return data
          manifest = json.loads(blob(os.environ['CHECKPOINT_SHA']))
          assert manifest['baseCommit'] == os.environ['STORE_BASE_SHA']
          review = Path(os.environ['RUNNER_TEMP']) / 'convenience-review'
          review.mkdir(parents=True, exist_ok=True)
          for entry in manifest['sources']:
              destination = root / entry['path']
              assert destination.resolve().is_relative_to(root)
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(blob(entry['blob']))
              print('restored', entry['path'])
          PY
      - name: ตรวจเกมและเตรียมแคช
        run: |
          node --check js/convenience-store.js
          node --check scripts/test-convenience-store.js
          node scripts/check-content.js | tee "$RUNNER_TEMP/convenience-review/check-content.log"
          node scripts/ship.js | tee "$RUNNER_TEMP/convenience-review/ship.log"
          git diff --check
      - name: เตรียมเครื่องมือเบราว์เซอร์นอก repo
        run: |
          npm install --prefix "$RUNNER_TEMP/convenience-browser" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/convenience-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/convenience-browser/node_modules/playwright" >> "$GITHUB_ENV"
          echo "NODE_PATH=$RUNNER_TEMP/convenience-browser/node_modules" >> "$GITHUB_ENV"
          echo "CONVENIENCE_REVIEW=$RUNNER_TEMP/convenience-review" >> "$GITHUB_ENV"
          echo "SHOTS=$RUNNER_TEMP/convenience-review/shots" >> "$GITHUB_ENV"
      - name: ทดสอบรอบเล่นด้วย Chromium
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { chromium } = require(process.env.PLAYWRIGHT_MODULE);
          const run = require(path.join(process.cwd(), 'scripts/test-convenience-store.js'));
          fs.mkdirSync(process.env.SHOTS, { recursive: true });
          run(chromium, { shots: process.env.SHOTS }).then(async (results) => {
            const output = { passed: results.filter((r) => r.ok).length, total: results.length, results };
            fs.writeFileSync(path.join(process.env.CONVENIENCE_REVIEW, 'browser-results.json'), JSON.stringify(output, null, 2));
            results.forEach((r) => console.log((r.ok ? 'ผ่าน ' : 'ไม่ผ่าน ') + r.name + (!r.ok ? ' ' + JSON.stringify(r.detail) : '')));
            console.log(output.passed + '/' + output.total + ' ผ่าน');
            for (const name of ["setup", "pass", "summary"]) {
              const file = path.join(process.env.SHOTS, "convenience-store-" + name + ".png");
              if (!fs.existsSync(file)) continue;
              const response = await fetch("https://api.github.com/repos/" + process.env.GITHUB_REPOSITORY + "/git/blobs", {
                method: "POST", headers: { Authorization: "Bearer " + process.env.GH_TOKEN, Accept: "application/vnd.github+json", "Content-Type": "application/json" },
                body: JSON.stringify({ content: fs.readFileSync(file).toString("base64"), encoding: "utf-8" })
              });
              if (!response.ok) throw new Error("เก็บภาพตรวจไม่สำเร็จ " + response.status);
              console.log("REVIEW_IMAGE " + name + " " + (await response.json()).sha);
            }
            if (output.passed !== output.total) process.exitCode = 1;
          }).catch((error) => { console.error(error); process.exitCode = 1; });
          NODE
      - name: บันทึกเฉพาะชุดที่ทดสอบผ่าน
        run: |
          node - <<'NODE'
          const fs = require('fs'), path = require('path');
          const report = JSON.parse(fs.readFileSync(path.join(process.env.CONVENIENCE_REVIEW, 'browser-results.json'), 'utf8'));
          if (report.passed !== report.total || !report.total) throw new Error('ยังไม่ผ่านการทดสอบครบ');
          const previous = fs.readFileSync('docs/CONTENT-REVIEW-convenience-store.md', 'utf8');
          const sourceStart = previous.indexOf('# ตรวจเนื้อหาชั้น');
          if (sourceStart < 0) throw new Error('ข้อมูลตรวจต้นทางไม่ครบ');
          const sources = previous.slice(sourceStart);
          const lines = ['# ตรวจเกมร้านสะดวกซื้อ ลื้อสะดวกใจ', '',
          'ใช้ชื่อคงที่ “คนที่ 1” และ “คนที่ 2” ตลอดเกม ไม่มีช่องกรอกชื่อ หน้าตั้งค่าเหลือเลือกรอบและหมวด พร้อมสลับบทบาทในแต่ละรอบ', '',
          '- คนที่ 1 เลือกรอบแรก คนที่ 2 ทาย จากนั้นสลับบทบาทในรอบถัดไป ใช้หมายเลขเดียวกันในหน้าส่งเครื่อง เฉลย และสรุป',
          '- รีเซ็ตแล้วล้างคำตอบและกลับไปโฟกัสปุ่มเริ่มเกม',
          '- คลังเดิม 45 สถานการณ์และ 54 ตัวเลือกใน 9 หมวด พร้อมภาพและข้อมูลสิทธิ์ครบ',
          '- check-content.js ผ่าน ไม่มี ERROR; ship.js สร้างจำนวนหน้าแรกและเลื่อนแคชแล้ว',
          '- Playwright/Chromium ผ่าน ' + report.passed + '/' + report.total + ' รวมเริ่มโดยไม่มีช่องชื่อ สลับบทบาท คะแนน ความลับ คีย์บอร์ด ภาพเสีย และออฟไลน์จริง', '',
          'หลักฐานและภาพหน้าจอ: https://github.com/' + process.env.GITHUB_REPOSITORY + '/actions/runs/' + process.env.GITHUB_RUN_ID, '', sources];
          fs.writeFileSync('docs/CONTENT-REVIEW-convenience-store.md', lines.join('\n').trimEnd() + '\n');
          NODE
          node scripts/check-content.js > "$RUNNER_TEMP/convenience-review/check-before-commit.log"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add convenience-store.html js/convenience-store.js css/convenience-store.css docs/CONTENT-GUIDE.md scripts/test-convenience-store.js sw.js data/game-counts.js docs/CONTENT-REVIEW-convenience-store.md
          git commit -m "ใช้คนที่ 1 และคนที่ 2 โดยไม่ต้องกรอกชื่อ"
          git push origin "HEAD:$GITHUB_REF_NAME"
          git rev-parse HEAD | tee "$RUNNER_TEMP/convenience-review/tested-commit.txt"
      - name: เก็บหลักฐานการตรวจ
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: convenience-store-players-review
          path: ${{ runner.temp }}/convenience-review
          retention-days: 14
