name: ตรวจเกมธงชาติและรูปทรงประเทศก่อนเผยแพร่

on:
  push:
    branches: ["codex/verify-country-quiz-20261117"]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      STORE_BASE_SHA: "a659f36a82128a6cfb4236e87124e7fffbfdc282"
      CHECKPOINT_SHA: "1eef551398664ca6f5322f04ca99bc256ca30183"
    steps:
      - name: ดึงฐานที่ต้องตรวจ
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: เตรียม Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: ตรวจคลังฐานเดิม
        run: node scripts/check-content.js
      - name: คืนร่างเกมและคลังประเทศสำหรับตรวจ
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, json, base64, hashlib, urllib.request
          from pathlib import Path
          root = Path.cwd().resolve()
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          def blob(sha):
              req = urllib.request.Request('https://api.github.com/repos/' + repo + '/git/blobs/' + sha, headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req, timeout=60) as response: obj = json.load(response)
              data = base64.b64decode(obj['content'])
              assert hashlib.sha1(('blob ' + str(len(data)) + '\0').encode() + data).hexdigest() == sha, 'blob digest ' + sha
              return data
          manifest = json.loads(blob(os.environ['CHECKPOINT_SHA']))
          assert manifest['baseCommit'] == os.environ['STORE_BASE_SHA']
          review = Path(os.environ['RUNNER_TEMP']) / 'country-review'
          review.mkdir(parents=True, exist_ok=True)
          for entry in manifest['sources']:
              destination = root / entry['path']
              assert destination.resolve().is_relative_to(root)
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(blob(entry['blob']))
              print('restored', entry['path'])
          (Path(os.environ['RUNNER_TEMP']) / 'countries-input.json').write_bytes(blob(manifest['countriesInput']))
          PY
      - name: รับคลังประเทศ ดึงธง และตรวจทั้งเว็บ
        run: |
          node --check js/country-quiz.js
          node --check scripts/test-country-quiz.js
          node --check scripts/fetch-country-flags.js
          node scripts/add-entries.js countryquiz "$RUNNER_TEMP/countries-input.json" --dry --init
          node scripts/add-entries.js countryquiz "$RUNNER_TEMP/countries-input.json" --init
          node scripts/fetch-country-flags.js
          node scripts/fetch-country-flags.js --check
          node scripts/check-content.js | tee "$RUNNER_TEMP/country-review/check-content.log"
          node scripts/ship.js | tee "$RUNNER_TEMP/country-review/ship.log"
          test "$(git hash-object data/worldmap.js)" = "de4dab2182120d7c5c1c47da6574eb2d8fdd0653"
          git add --intent-to-add flag-quiz.html country-shape.html css/country-quiz.css js/country-quiz.js scripts/fetch-country-flags.js assets/country-quiz/CREDITS.md scripts/test-country-quiz.js scripts/build-game-counts.js index.html sw.js docs/CONTENT-GUIDE.md scripts/content-pools.js scripts/check-content.js data/country-quiz.js data/game-counts.js assets/country-quiz/flags assets/country-quiz/LICENSE-flag-icons.txt assets/country-quiz/LICENSE-world-countries.md
          git diff --check -- . ':(exclude)assets/country-quiz/LICENSE-flag-icons.txt' ':(exclude)assets/country-quiz/LICENSE-world-countries.md'
      - name: เตรียมเครื่องมือเบราว์เซอร์นอก repo
        run: |
          npm install --prefix "$RUNNER_TEMP/country-browser" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/country-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/country-browser/node_modules/playwright" >> "$GITHUB_ENV"
          echo "NODE_PATH=$RUNNER_TEMP/country-browser/node_modules" >> "$GITHUB_ENV"
          echo "COUNTRY_REVIEW=$RUNNER_TEMP/country-review" >> "$GITHUB_ENV"
          echo "SHOTS=$RUNNER_TEMP/country-review/shots" >> "$GITHUB_ENV"
      - name: ทดสอบรอบเล่นด้วย Chromium
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { chromium } = require(process.env.PLAYWRIGHT_MODULE);
          const run = require(path.join(process.cwd(), 'scripts/test-country-quiz.js'));
          fs.mkdirSync(process.env.SHOTS, { recursive: true });
          run(chromium, { shots: process.env.SHOTS }).then(async (results) => {
            const output = { passed: results.filter((r) => r.ok).length, total: results.length, results };
            fs.writeFileSync(path.join(process.env.COUNTRY_REVIEW, 'browser-results.json'), JSON.stringify(output, null, 2));
            results.forEach((r) => console.log((r.ok ? 'ผ่าน ' : 'ไม่ผ่าน ') + r.name + (!r.ok ? ' ' + JSON.stringify(r.detail) : '')));
            console.log(output.passed + '/' + output.total + ' ผ่าน');
            for (const name of ["flag-reveal", "shape-thailand", "desktop-shape"]) {
              const file = path.join(process.env.SHOTS, "country-quiz-" + name + ".png");
              if (!fs.existsSync(file)) continue;
              const response = await fetch("https://api.github.com/repos/" + process.env.GITHUB_REPOSITORY + "/git/blobs", {
                method: "POST", headers: { Authorization: "Bearer " + process.env.GH_TOKEN, Accept: "application/vnd.github+json", "Content-Type": "application/json" },
                body: JSON.stringify({ content: fs.readFileSync(file).toString("base64"), encoding: "utf-8" })
              });
              if (!response.ok) throw new Error("เก็บภาพตรวจไม่สำเร็จ " + response.status);
              console.log("REVIEW_IMAGE " + name + " " + (await response.json()).sha);
            }
            if (output.passed !== output.total) process.exitCode = 1;
          }).catch((error) => { console.error(error); process.exitCode = 1; });
          NODE
      - name: บันทึกเฉพาะชุดที่ทดสอบผ่าน
        run: |
          node - <<'NODE'
          const fs = require('fs'), path = require('path'), vm = require('vm');
          const report = JSON.parse(fs.readFileSync(path.join(process.env.COUNTRY_REVIEW, 'browser-results.json'), 'utf8'));
          if (report.passed !== report.total || !report.total) throw new Error('ยังไม่ผ่านการทดสอบครบ');
          const list = vm.runInNewContext(fs.readFileSync('data/country-quiz.js', 'utf8') + ';COUNTRY_QUIZ_LIST');
          const lines = ['# ตรวจเกมทายธงชาติและทายประเทศจากรูปร่าง', '',
          'สองเกมใช้คลังร่วม ' + list.length + ' ประเทศ เลือกแยกหกทวีป ตอบออกเสียงแล้วกดเฉลยหรือข้ามไปประเทศถัดไป', '',
          '- ธงชาติเป็น SVG จากอินเทอร์เน็ตที่ตรวจรหัส Git SHA-1 ตรงต้นทางครบทุกไฟล์ พร้อม MIT และฐานข้อมูล ODbL ต้นฉบับ',
          '- รูปทรงใช้ Natural Earth จาก WORLD_MAP เดิม ไม่แก้ข้อมูลต้นทาง แสดงประเทศเดี่ยวหันเหนือขึ้นและบอกส่วนแผ่นดินที่ใช้หลังเฉลย',
          '- ข้อมูลต้นทางและสิทธิ์แยกตามภาพธง เรขาคณิต และฐานข้อมูลใน assets/country-quiz/CREDITS.md',
          '- สร้างคลังผ่าน add-entries.js --dry --init และ --init; fetch-country-flags.js --check ผ่าน',
          '- check-content.js ไม่มี ERROR; ship.js สร้างจำนวนหน้าแรกและเลื่อนแคชแล้ว',
          '- Playwright/Chromium ผ่าน ' + report.passed + '/' + report.total + ' รวมเฉลย เปลี่ยนทวีป ถุงสุ่ม รูปธงทุกไฟล์ รูปทรงครบคลัง ประเทศไทย คีย์บอร์ด จอเล็ก ภาพเสีย การโหลดช้า และออฟไลน์จริง',
          '- ตรวจผ่าน GitHub Actions เนื่องจากเครื่อง Codex Cloud เริ่มไม่สำเร็จ', '',
          'หลักฐานและภาพหน้าจอ: https://github.com/' + process.env.GITHUB_REPOSITORY + '/actions/runs/' + process.env.GITHUB_RUN_ID, ''];
          fs.writeFileSync('docs/CONTENT-REVIEW-country-quiz.md', lines.join('\n').trimEnd() + '\n');
          NODE
          node scripts/check-content.js > "$RUNNER_TEMP/country-review/check-before-commit.log"
          git diff --check -- . ':(exclude)assets/country-quiz/LICENSE-flag-icons.txt' ':(exclude)assets/country-quiz/LICENSE-world-countries.md'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flag-quiz.html country-shape.html css/country-quiz.css js/country-quiz.js scripts/fetch-country-flags.js assets/country-quiz/CREDITS.md scripts/test-country-quiz.js scripts/build-game-counts.js index.html sw.js docs/CONTENT-GUIDE.md scripts/content-pools.js scripts/check-content.js data/country-quiz.js data/game-counts.js docs/CONTENT-REVIEW-country-quiz.md assets/country-quiz/flags assets/country-quiz/LICENSE-flag-icons.txt assets/country-quiz/LICENSE-world-countries.md
          git commit -m "เพิ่มเกมทายธงชาติและทายประเทศจากรูปทรง"
          git push origin "HEAD:$GITHUB_REF_NAME"
          git rev-parse HEAD | tee "$RUNNER_TEMP/country-review/tested-commit.txt"
      - name: เก็บหลักฐานการตรวจ
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: country-quiz-review
          path: ${{ runner.temp }}/country-review
          retention-days: 14
