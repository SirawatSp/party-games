name: ตรวจชั้นรสชาติและเพลงก่อนเผยแพร่

on:
  push:
    branches: ["codex/verify-store-flavors-20261116"]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      STORE_BASE_SHA: "75d3f967f6505a1e4fe749b86d5dcdcc0c592fb6"
      CHECKPOINT_SHA: "f54595e1b5ef0c21c3eb753418662cdb2a334e7d"
    steps:
      - name: ดึงฐานที่ต้องตรวจ
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: เตรียม Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: ตรวจคลังฐานเดิม
        run: node scripts/check-content.js
      - name: คืนร่างและภาพจากจุดกู้
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, json, base64, hashlib, urllib.request, xml.etree.ElementTree as ET
          from pathlib import Path
          root = Path.cwd().resolve()
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          def blob(sha):
              req = urllib.request.Request('https://api.github.com/repos/' + repo + '/git/blobs/' + sha, headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req, timeout=60) as response: obj = json.load(response)
              data = base64.b64decode(obj['content'])
              assert hashlib.sha1(('blob ' + str(len(data)) + '\0').encode() + data).hexdigest() == sha, 'blob digest ' + sha
              return data
          manifest = json.loads(blob(os.environ['CHECKPOINT_SHA']))
          assert manifest['baseCommit'] == os.environ['STORE_BASE_SHA']
          inputs = Path(os.environ['RUNNER_TEMP']) / 'convenience-inputs'
          inputs.mkdir(parents=True, exist_ok=True)
          review = Path(os.environ['RUNNER_TEMP']) / 'convenience-review'
          review.mkdir(parents=True, exist_ok=True)
          for entry in manifest['sources']:
              destination = root / entry['path']
              assert destination.resolve().is_relative_to(root)
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(blob(entry['blob']))
              print('restored', entry['path'])
          for name, key in [('rounds.json', 'roundsInput'), ('products.json', 'productsInput')]:
              (inputs / name).write_bytes(blob(manifest[key]))
          (review / 'source-review.md').write_bytes(blob(manifest['reviewSource']))
          images = json.loads((inputs / 'products.json').read_text())
          assert len(images) == 18
          for item in images:
              file = root / item['image']
              svg = ET.fromstring(file.read_bytes())
              assert svg.tag == '{http://www.w3.org/2000/svg}svg'
              assert svg.attrib['viewBox'] == '0 0 320 320'
              assert not any(node.tag.endswith(('script', 'image', 'foreignObject')) for node in svg.iter())
              assert all(not key.endswith('href') for node in svg.iter() for key in node.attrib)
          print('SVG XML and local image files verified', len(images))
          PY
      - name: รับคลังใหม่ ตรวจข้อมูล และเตรียมแคช
        run: |
          node scripts/add-entries.js conveniencestore "$RUNNER_TEMP/convenience-inputs/rounds.json" --dry
          node scripts/add-entries.js conveniencestore "$RUNNER_TEMP/convenience-inputs/rounds.json"
          node scripts/add-entries.js convenienceproducts "$RUNNER_TEMP/convenience-inputs/products.json" --dry
          node scripts/add-entries.js convenienceproducts "$RUNNER_TEMP/convenience-inputs/products.json"
          node --check js/convenience-store.js
          node --check scripts/test-convenience-store.js
          node scripts/check-content.js | tee "$RUNNER_TEMP/convenience-review/check-content.log"
          node scripts/ship.js | tee "$RUNNER_TEMP/convenience-review/ship.log"
          git diff --check
      - name: เตรียมเครื่องมือเบราว์เซอร์นอก repo
        run: |
          npm install --prefix "$RUNNER_TEMP/convenience-browser" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/convenience-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/convenience-browser/node_modules/playwright" >> "$GITHUB_ENV"
          echo "NODE_PATH=$RUNNER_TEMP/convenience-browser/node_modules" >> "$GITHUB_ENV"
          echo "CONVENIENCE_REVIEW=$RUNNER_TEMP/convenience-review" >> "$GITHUB_ENV"
          echo "SHOTS=$RUNNER_TEMP/convenience-review/shots" >> "$GITHUB_ENV"
      - name: ทดสอบรอบเล่นด้วย Chromium
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { chromium } = require(process.env.PLAYWRIGHT_MODULE);
          const run = require(path.join(process.cwd(), 'scripts/test-convenience-store.js'));
          fs.mkdirSync(process.env.SHOTS, { recursive: true });
          run(chromium, { shots: process.env.SHOTS }).then(async (results) => {
            const output = { passed: results.filter((r) => r.ok).length, total: results.length, results };
            fs.writeFileSync(path.join(process.env.CONVENIENCE_REVIEW, 'browser-results.json'), JSON.stringify(output, null, 2));
            results.forEach((r) => console.log((r.ok ? 'ผ่าน ' : 'ไม่ผ่าน ') + r.name + (!r.ok ? ' ' + JSON.stringify(r.detail) : '')));
            console.log(output.passed + '/' + output.total + ' ผ่าน');
            for (const name of ["mama-shelf", "lays-shelf", "music-shelf"]) {
              const file = path.join(process.env.SHOTS, "convenience-store-" + name + ".png");
              if (!fs.existsSync(file)) continue;
              const response = await fetch("https://api.github.com/repos/" + process.env.GITHUB_REPOSITORY + "/git/blobs", {
                method: "POST", headers: { Authorization: "Bearer " + process.env.GH_TOKEN, Accept: "application/vnd.github+json", "Content-Type": "application/json" },
                body: JSON.stringify({ content: fs.readFileSync(file).toString("base64"), encoding: "utf-8" })
              });
              if (!response.ok) throw new Error("เก็บภาพตรวจไม่สำเร็จ " + response.status);
              console.log("REVIEW_IMAGE " + name + " " + (await response.json()).sha);
            }
            if (output.passed !== output.total) process.exitCode = 1;
          }).catch((error) => { console.error(error); process.exitCode = 1; });
          NODE
      - name: บันทึกเฉพาะชุดที่ทดสอบผ่าน
        run: |
          node - <<'NODE'
          const fs = require('fs'), path = require('path'), vm = require('vm');
          const report = JSON.parse(fs.readFileSync(path.join(process.env.CONVENIENCE_REVIEW, 'browser-results.json'), 'utf8'));
          if (report.passed !== report.total || !report.total) throw new Error('ยังไม่ผ่านการทดสอบครบ');
          const list = (file, name) => vm.runInNewContext(fs.readFileSync(file, 'utf8') + ';' + name);
          const prompts = list('data/convenience-store.js', 'CONVENIENCE_STORE_LIST');
          const products = list('data/convenience-products.js', 'CONVENIENCE_PRODUCTS');
          if (prompts.length !== 45 || products.length !== 54 || new Set(prompts.map(p => p.cat)).size !== 9) throw new Error('ยอดคลังไม่ตรง');
          const notes = fs.readFileSync(path.join(process.env.CONVENIENCE_REVIEW, 'source-review.md'), 'utf8').split('\nผลนี้เป็นการตรวจเนื้อหา')[0];
          const lines = ['# ตรวจเกมร้านสะดวกซื้อ ลื้อสะดวกใจ', '',
          'เพิ่มชั้นรสมาม่า รสเลย์ และเพลงฮิตให้เลือกก่อนส่งเครื่องทายใจ สลับบทบาทและนับคะแนนตามเดิม', '',
          '- สถานการณ์ 30 → ' + prompts.length + ' ข้อ และตัวเลือก 36 → ' + products.length + ' รายการ รวม 9 หมวด',
          '- ภาพ SVG วาดใหม่ 18 ภาพ มีเครดิตรายตัวเลือกและเก็บออฟไลน์ครบ ไม่ใช้รูปซองจริง ปกต้นฉบับ หรือไฟล์เสียง',
          '- add-entries.js --dry และคำสั่งเพิ่มจริงผ่านทั้งสองคลัง; check-content.js ไม่มี ERROR',
          '- ship.js สร้างจำนวนหน้าแรกและเลื่อนแคชแล้ว',
          '- Playwright/Chromium ผ่าน ' + report.passed + '/' + report.total + ' รวมหมวดเดิม หมวดใหม่ การส่งเครื่อง ความลับ คะแนน ขนาดจอ คีย์บอร์ด ภาพ PNG/SVG เสีย และออฟไลน์จริง',
          '- ตรวจ XML ของ SVG ทุกไฟล์ และเปิดภาพผ่าน Chromium แล้ว', '',
          'หลักฐานและภาพหน้าจอ: https://github.com/' + process.env.GITHUB_REPOSITORY + '/actions/runs/' + process.env.GITHUB_RUN_ID, '', notes, ''];
          fs.writeFileSync('docs/CONTENT-REVIEW-convenience-store.md', lines.join('\n'));
          NODE
          node scripts/check-content.js > "$RUNNER_TEMP/convenience-review/check-before-commit.log"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add convenience-store.html js/convenience-store.js assets/convenience-store/CREDITS.md sw.js index.html assets/convenience-store/mama-minced-pork.svg assets/convenience-store/mama-tom-yum.svg assets/convenience-store/mama-creamy-tom-yum.svg assets/convenience-store/mama-palo-duck.svg assets/convenience-store/mama-nam-tok.svg assets/convenience-store/mama-tom-saab.svg assets/convenience-store/lays-original.svg assets/convenience-store/lays-nori.svg assets/convenience-store/lays-bbq.svg assets/convenience-store/lays-sour-cream.svg assets/convenience-store/lays-hot-squid.svg assets/convenience-store/lays-miang-kham.svg assets/convenience-store/song-bad-boy.svg assets/convenience-store/song-melt.svg assets/convenience-store/song-ghost.svg assets/convenience-store/song-you.svg assets/convenience-store/song-until-then.svg assets/convenience-store/song-only-you.svg scripts/content-pools.js scripts/check-content.js docs/CONTENT-GUIDE.md scripts/test-convenience-store.js data/convenience-store.js data/convenience-products.js data/game-counts.js docs/CONTENT-REVIEW-convenience-store.md
          git commit -m "เพิ่มชั้นเลือกรสมาม่า รสเลย์ และเพลงฮิตสำหรับทายใจ"
          git push origin "HEAD:$GITHUB_REF_NAME"
          git rev-parse HEAD | tee "$RUNNER_TEMP/convenience-review/tested-commit.txt"
      - name: เก็บหลักฐานการตรวจ
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: convenience-store-flavors-review
          path: ${{ runner.temp }}/convenience-review
          retention-days: 14
